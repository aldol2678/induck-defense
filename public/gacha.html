/* v0.2 interface updates */
.item-btn{display:block;width:100%;font:inherit;color:inherit;cursor:pointer}.item-btn:focus-visible{outline:3px solid #478772;outline-offset:1px}
.banner-goal{background:#fffaf0;border:1px solid #eddbb8;border-radius:14px;padding:13px;margin-top:11px}
.banner-goal .goal-icon{height:46px;width:46px;display:grid;place-items:center;border-radius:12px;background:#f4e4c1;font-size:28px}
.gacha-guide{display:flex;gap:9px;align-items:center;margin-top:10px;font-size:11px;color:#587568;line-height:1.5}
.rarity-pulse{animation:appearPulse .5s cubic-bezier(.2,.8,.2,1) both}
.reveal-shell{border:1px solid #e6cf9b;border-radius:20px;background:radial-gradient(circle,#fff5dd,#efe8db);padding:22px 12px;text-align:center;margin:12px 0 15px}
.reveal-envelope{font-size:83px;line-height:1.2;animation:floatEnvelope 1.8s ease-in-out infinite}
.reveal-flare{font-size:10px;font-weight:900;letter-spacing:2px;color:#8c6b3c;margin:8px 0}
.result-card{animation:appearPulse .38s ease both}.result-grid .result-card:nth-child(2){animation-delay:.06s}.result-grid .result-card:nth-child(3){animation-delay:.12s}.result-grid .result-card:nth-child(4){animation-delay:.18s}.result-grid .result-card:nth-child(5){animation-delay:.24s}
.result-grid .result-card:nth-child(n+6){animation-delay:.28s}
.detail-preview{font-size:76px;text-align:center;background:#f3f1e7;padding:22px;border-radius:18px;margin:13px 0}
.rule-box{background:#f6f5ef;border:1px solid #e7e9dc;border-radius:11px;padding:11px;margin:10px 0;font-size:11px;color:#6b7d70;line-height:1.7}
.rule-box strong{color:#285e4b}
.upcoming{display:inline-block;background:#fff0dc;color:#995c30;font-size:10px;font-weight:900;padding:2px 6px;border-radius:30px}
@keyframes appearPulse{from{transform:translateY(12px) scale(.95);opacity:.1}to{transform:none;opacity:1}}
@keyframes floatEnvelope{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@media(prefers-reduced-motion:reduce){.reveal-envelope,.result-card,.rarity-pulse{animation:none!important}}

/* v0.3: rarity-specific reward cinematics, visual only. RNG/odds unaffected. */
.cinematic{--fx:#bdc9bc;--fg:#5d7765;--soft:#f0f5ee;position:relative;min-height:285px;isolation:isolate;overflow:hidden;border:1px solid color-mix(in srgb,var(--fx),white 28%);border-radius:22px;margin:13px 0 12px;background:radial-gradient(ellipse at 50% 38%,var(--soft),#f9f6ed 73%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 12px;text-align:center}
.cinematic.tier-rare{--fx:#629ee2;--fg:#2368bb;--soft:#e1efff}
.cinematic.tier-epic{--fx:#ae6ae5;--fg:#7540af;--soft:#eee1ff}
.cinematic.tier-legend{--fx:#f0bc57;--fg:#9a6511;--soft:#fff0c3;background:radial-gradient(ellipse at center 35%,#fff9e5,#ffedbc 55%,#edcea1 100%)}
.cinematic:before,.cinematic:after{content:'';position:absolute;left:50%;top:39%;border:2px solid var(--fx);border-radius:50%;width:175px;height:175px;transform:translate(-50%,-50%);opacity:.45;z-index:-1;pointer-events:none}
.cinematic:before{animation:fx-ring 1.4s ease-out infinite}
.cinematic:after{animation:fx-ring 1.4s .45s ease-out infinite}
.cinematic.tier-normal:before{animation:fx-soft .8s ease-out both}.cinematic.tier-normal:after{display:none}
.cinematic.tier-epic:before,.cinematic.tier-epic:after{border-style:dashed;animation-duration:1.0s}
.cinematic.tier-legend:before,.cinematic.tier-legend:after{border-width:4px;box-shadow:0 0 24px #f4c96f;animation-duration:1.05s}
.cinematic .fx-beam{position:absolute;width:240px;height:240px;top:39%;left:50%;margin-left:-120px;margin-top:-120px;z-index:-1;opacity:0;pointer-events:none;background:repeating-conic-gradient(from 0deg,transparent 0deg 16deg,color-mix(in srgb,var(--fx),transparent 70%) 17deg 22deg,transparent 23deg 38deg);border-radius:50%}
.cinematic.tier-rare .fx-beam{opacity:.5;animation:fx-turn 7s linear infinite}
.cinematic.tier-epic .fx-beam{opacity:.8;animation:fx-turn 4s linear infinite}
.cinematic.tier-legend .fx-beam{opacity:1;animation:fx-turn 2.7s linear infinite}
.cinematic .fx-particles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.cinematic .fx-particles i{position:absolute;left:var(--x);top:var(--y);color:var(--fx);font-size:var(--size);font-style:normal;opacity:0;filter:drop-shadow(0 0 3px var(--fx));animation:fx-particle var(--dur) var(--delay) ease-in-out infinite}
.cinematic .fx-icon{font-size:74px;line-height:1.1;z-index:1;filter:drop-shadow(0 6px 4px #25372c21);animation:fx-appear .6s cubic-bezier(.2,1.6,.4,1) both}
.cinematic.tier-rare .fx-icon{animation:fx-appear .7s cubic-bezier(.2,1.6,.4,1) both,fx-float 2.4s ease-in-out .7s infinite}
.cinematic.tier-epic .fx-icon{animation:fx-epic .9s cubic-bezier(.1,1.5,.3,1) both,fx-float 1.7s ease-in-out .9s infinite}
.cinematic.tier-legend .fx-icon{font-size:87px;animation:fx-legend 1.35s cubic-bezier(.12,1.1,.22,1) both,fx-float 2s ease-in-out 1.4s infinite}
.cinematic .fx-tag{margin-top:19px;border-radius:100px;background:color-mix(in srgb,var(--fx),white 77%);border:1px solid color-mix(in srgb,var(--fx),white 37%);color:var(--fg);font-size:11px;font-weight:1000;letter-spacing:2px;padding:6px 16px;z-index:1;animation:fx-label .45s .2s both}
.cinematic .fx-name{font-size:22px;font-weight:1000;letter-spacing:-.7px;color:#314339;margin-top:11px;word-break:keep-all;z-index:1;animation:fx-label .6s .3s both}
.cinematic.tier-legend .fx-name{color:#875715;text-shadow:0 1px 0 #fff}
.cinematic .fx-sub{font-size:11px;color:#777e74;margin-top:9px;z-index:1;line-height:1.5}
.cinematic .fx-numeral{position:absolute;right:13px;top:13px;color:var(--fg);font-weight:950;font-size:10px;letter-spacing:.6px;opacity:.85}

   if(merged.seasonTitleUnlocked){for(const x of merged.purchases||[]){if(x.id==='season'){const id=seasonId(x.date);if(!merged.seasonTitles.includes(id))merged.seasonTitles.push(id)}}}
   if(!Array.isArray(merged.receipts))merged.receipts=[];if(!Number.isFinite(merged.nextReceiptId))merged.nextReceiptId=0;return merged}}catch(e){}return defaultState()}

function nowText(){return new Intl.DateTimeFormat('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date())}

function week(){const d=new Date();const dt=new Date(d.getFullYear(),d.getMonth(),d.getDate());let dow=(dt.getDay()+6)%7;dt.setDate(dt.getDate()-dow);return `${dt.getFullYear()}-${dt.getMonth()+1}-${dt.getDate()}`}
function seasonId(date=today()){const [year,month]=String(date).split('-').map(Number);if(!Number.isFinite(year)||!Number.isFinite(month))return seasonId(today());return `${year}-Q${Math.floor((month-1)/3)+1}`}

function itemOdds(i){let probability=rateList.find(x=>x.id===i.rarity).weight;let pool=i.kind==='equipment'?EQUIPMENT:SKINS;let banner=section==='special'?(specialMode==='pickup'?'pickup':'focus'):'general';
 if(banner==='pickup'){if(i.kind!=='equipment')return 0;if(i.rarity==='legend')return i.id===s.selectedPickup?2:0;pool=EQUIPMENT;}

 return +(probability/pool.filter(x=>x.rarity===i.rarity).length).toFixed(4)}

function oddsRows(kind,mode){const pool=kind==='equipment'?EQUIPMENT:SKINS;const markup=pool.map(i=>{let prob;if(mode==='general'){prob=rateList.find(r=>r.id===i.rarity).weight/pool.filter(x=>x.rarity===i.rarity).length}else if(mode==='pickup'){if(i.kind!=='equipment')return '';prob=i.rarity==='legend'?(i.id===s.selectedPickup?2:0):rateList.find(r=>r.id===i.rarity).weight/pool.filter(x=>x.rarity===i.rarity).length}else {let majors=pool.filter(x=>x.rarity===i.rarity&&x.major===focusMajor);let shared=pool.filter(x=>x.rarity===i.rarity&&x.major==='shared');prob=rateList.find(r=>r.id===i.rarity).weight*(i.major===focusMajor?.7/Math.max(1,majors.length):i.major==='shared'?.3/Math.max(1,shared.length):0)}return {item:i,prob}}).filter(Boolean).filter(v=>v.prob>0).sort((a,b)=>['legend','epic','rare','normal'].indexOf(a.item.rarity)-['legend','epic','rare','normal'].indexOf(b.item.rarity));return markup.map(({item,prob})=>`<div class="choice-row"><span style="font-size:21px">${item.emoji}</span><div class="label">${esc(item.name)}<small>${rarityNames[item.rarity]} · ${MAJORS[item.major]}</small></div><strong class="small">${prob.toFixed(3)}%</strong></div>`).join('')}

function floatRand(){if(globalThis.crypto&&crypto.getRandomValues){const v=new Uint32Array(1);crypto.getRandomValues(v);return v[0]/4294967296}return Math.random()}

 for(let n=0;n<count;n++){

 const receiptId=addReceipt({banner:bannerName,cost:costText,before:pityText(beforePity),after:pityText(p),items:results.map(r=>({id:r.item.id,name:r.item.name,rarity:rarityNames[r.item.rarity],duplicate:r.dup,shards:r.shards}))});

function showResults(results,total,ticket){

if(d.rouletteReset!==undefined){if(spinning||s.roulette.claimed.length!==8)return;const next=s.roulette.cycle+1;pop(`<div class="row between"><div class="dialog-title">🔄 룰렛을 초기화할까요?</div><button class="dialog-close" data-close>×</button></div><p class="small muted">${next}번째 보상판을 시작합니다. 현재 획득한 상품·RC·선택권·조각·거래 기록은 그대로 유지합니다.</p><div class="rule-box">초기화 자체는 무료입니다.<br>새 보상판의 <strong>첫 회차는 90 RC</strong>이며, 완주 총 비용은 <strong>2,290 RC</strong>입니다.<br>한정 스킨 중복 획득 시 스킨 조각으로 변환됩니다.</div><div class="draw-actions"><button class="action outline" data-close>취소</button><button class="action primary" data-confirm-roulette-reset>새 보상판 시작</button></div>`);return}
if(d.confirmRouletteReset!==undefined){if(spinning||s.roulette.claimed.length!==8)return;s.roulette.claimed=[];s.roulette.cycle+=1;wheelAngle=0;log('🎡 룰렛 보상판 초기화',`${s.roulette.cycle}번째 보상판 시작 · 기존 보상 보존 · 첫 회 90 RC`);save();closePop();section='roulette';render();toast('새 룰렛 보상판을 시작했어요!');return}

if(d.close!==undefined){closePop();return}if(d.view){view=d.view;render(true);return}if(d.section){section=d.section;render(true);return}if(d.generalKind){generalKind=d.generalKind;render();return}if(d.specialMode){specialMode=d.specialMode;render();return}if(d.focusMajor){focusMajor=d.focusMajor;render();return}if(d.inventoryKind){inventoryKind=d.inventoryKind;render();return}if(d.inventoryMode){inventoryMode=d.inventoryMode;render();return}if(d.pull){pull(d.banner,Number(d.pull));return}if(d.spin!==undefined){spin();return}if(d.goInventory){view='inventory';inventoryKind=d.goInventory;render(true);return}if(d.buy){confirmPackage(d.buy);return}if(d.confirmBuy){const id=d.confirmBuy;closePop();buyPackage(id);return}if(d.equipTitle!==undefined){const id=d.equipTitle;const allowed=id==='none'||(id==='starter'&&s.titleUnlocked)||s.seasonTitles.includes(id);if(allowed){s.equippedTitle=id==='none'?'':id;save();render();toast('명찰을 변경했어요.')}return}if(d.claim){claim(d.claim);return}if(d.topup!==undefined){s.ic+=500;s.rc+=1000;log('🧪 개발자 지갑 충전','+500 IC · +1000 RC (테스트 전용)');save();render();toast('테스트 재화가 충전됐어요.');return}if(d.exchangeIc!==undefined){if(s.ic>=100){s.ic-=100;s.rc+=120;log('💱 IC → RC','100 IC 사용 · 120 RC 획득');save();render();toast('120 RC 교환 완료')}}
if(d.useChoice!==undefined){openChoice(Number(d.useChoice));return}if(d.choiceItem){let idx=Number(d.choiceIndex),choiceData=s.choices[idx],item=ALL.find(x=>x.id===d.choiceItem);if(!choiceData||!item||item.kind!==choiceData.kind||item.rarity!==choiceData.rarity)return;s.choices.splice(idx,1);let result=rewardItem(item);log('🎁 선택권 사용',`${item.name} ${result.dup?'중복 조각 +'+result.shards:'해금'}`);save();closePop();render();toast(item.name+' 보상이 지급됐어요.');return}if(d.openExchange!==undefined){openExchange();return}if(d.exchangeItem){let item=ALL.find(x=>x.id===d.exchangeItem);if(!item||s.owned.includes(item.id))return;let cost=item.rarity==='epic'?120:item.rarity==='legend'?300:Infinity;if(s.shards[item.kind]>=cost){s.shards[item.kind]-=cost;rewardItem(item);log('🧩 조각 교환',`${item.name} · ${cost} 조각 사용`);save();render();openExchange();toast(item.name+' 해금 완료')}return}if(d.reset!==undefined){confirmReset();return}if(d.confirmReset!==undefined){s=defaultState();spinning=false;wheelAngle=0;save();closePop();view='gacha';section='general';render(true);toast('데모 데이터가 초기화됐어요.');return}
}
document.addEventListener('click',handleClick);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&pendingReveal)finishCinematic();else if(document.hidden)stopLegendSound()});
document.addEventListener('keydown',e=>{const modal=$('#overlay .dialog');if(!modal)return;if(e.key==='Escape'){e.preventDefault();if(pendingReveal)finishCinematic();else closePop();return}if(e.key==='Tab'){const nodes=[...modal.querySelectorAll('button:not([disabled]),[href],input:not([disabled]),[tabindex="0"]')].filter(el=>el.getClientRects().length>0);if(!nodes.length){e.preventDefault();modal.focus();return}let first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===modal)){e.preventDefault();last.focus()}else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===modal)){e.preventDefault();first.focus()}}});
render();
})();
</script>
</body>
</html>
